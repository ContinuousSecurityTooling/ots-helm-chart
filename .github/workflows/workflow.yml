name: Build

on:
  # allow to manual run tests
  workflow_dispatch:
      inputs:
          runChartTesting:
              description: 'Maven CLI opts, e.g. -U'
              required: false
              type: choice
              options:
                - yes
                - no
              default: 'no'
  pull_request:
  merge_group:
  push:
    branches:
      - develop

jobs:
  chart:
    name: 'Build and Test Helm Chart'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.11.2

      # Python is required because `ct lint` runs Yamale (https://github.com/23andMe/Yamale) and
      # yamllint (https://github.com/adrienverge/yamllint) which require Python
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          check-latest: true

      - name: Helm Chart Testing
        uses: helm/chart-testing-action@v2.8.0
        with:
          version: v3.10.1
          yamale_version: '6.0.0'

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .ct.yaml  --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true' || ${{ inputs.runChartTesting }} == 'yes'
        run: ct lint --config .ct.yaml --target-branch ${{ github.event.repository.default_branch }}

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true' || ${{ inputs.runChartTesting }} == 'yes'
        uses: helm/kind-action@v1.14.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true' || ${{ inputs.runChartTesting }} == 'yes'
        run: ct install --config .ct.yaml --target-branch ${{ github.event.repository.default_branch }}

      - name: Download & install kube-prom-stack
        if: steps.list-changed.outputs.changed == 'true' || ${{ inputs.runChartTesting }} == 'yes'
        run: |
          mkdir charts
          cd charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm pull prometheus-community/kube-prometheus-stack
          helm install kube-prom prometheus-community/kube-prometheus-stack

      - name: Run chart-testing (install - with args)
        if: steps.list-changed.outputs.changed == 'true' || ${{ inputs.runChartTesting }} == 'yes'
        run: ct install --target-branch ${{ github.event.repository.default_branch }} --helm-extra-set-args "-f chart/ci.values.yaml"
